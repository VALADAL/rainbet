<script id="rbCurCore">(function(){
if(window.RBCUR)return;
var CODES=['ARS','AUD','BRL','CAD','CHF','CNY','DKK','EUR','GBP','HKD','JPY','MXN','PHP','RUB','SEK','SGD','TRY','USD'];
var SYM={ARS:'AR$',AUD:'A$',BRL:'R$',CAD:'C$',CHF:'CHF ',CNY:'\u00a5',DKK:'kr ',EUR:'\u20ac',GBP:'\u00a3',HKD:'HK$',JPY:'\u00a5',MXN:'MX$',PHP:'\u20b1',RUB:'\u20bd',SEK:'kr ',SGD:'S$',TRY:'\u20ba',USD:'$'};
/* Tasas de respaldo (unidades por 1 USD). Si hay internet se reemplazan por las reales. */
var FALL={ARS:1450,AUD:1.52,BRL:5.45,CAD:1.38,CHF:0.80,CNY:7.12,DKK:6.45,EUR:0.865,GBP:0.745,HKD:7.78,JPY:150,MXN:18.4,PHP:58,RUB:82,SEK:9.45,SGD:1.29,TRY:42,USD:1};
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var rates={};for(var i=0;i<CODES.length;i++)rates[CODES[i]]=FALL[CODES[i]];
try{var c=JSON.parse(g('rb_rates')||'null');if(c&&c.r){for(var k in c.r){if(rates.hasOwnProperty(k)&&c.r[k]>0&&k!=='USD')rates[k]=c.r[k]}}}catch(e){}
var code=g('rb_cur');if(CODES.indexOf(code)<0)code='USD';
function pick(src,lower){var r={};for(var i=0;i<CODES.length;i++){var k=CODES[i],v=src[lower?k.toLowerCase():k];if(typeof v==='number'&&v>0)r[k]=v}return r}
function done(r){if(Object.keys(r).length<10)return;s('rb_rates',JSON.stringify({t:Date.now(),r:r}));if(code==='USD'){for(var k in r){if(k!=='USD')rates[k]=r[k]}}}
function refresh(){
 try{var c=JSON.parse(g('rb_rates')||'null');if(c&&c.t&&Date.now()-c.t<6*36e5)return}catch(e){}
 try{
  fetch('https://open.er-api.com/v6/latest/USD').then(function(x){return x.json()}).then(function(j){if(j&&j.rates)done(pick(j.rates,false));else throw 0}).catch(function(){
   fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json').then(function(x){return x.json()}).then(function(j){if(j&&j.usd)done(pick(j.usd,true))}).catch(function(){})});
 }catch(e){}
}
function fmt(n,c){c=c||code;n=+n;if(!isFinite(n))n=0;return (n<0?'-':'')+SYM[c]+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function bal(){try{if(typeof balance==='number'&&isFinite(balance))return balance}catch(e){}var b=parseFloat(g('bj_bal'));return isFinite(b)?b:1000}
function set(nc){
 if(CODES.indexOf(nc)<0||nc===code)return false;
 var oc=code,f=rates[nc]/rates[oc];
 var b=parseFloat(g('bj_bal'));if(!isFinite(b))b=1000;
 s('bj_bal',String(Math.round(b*f*100)/100));
 try{var r=JSON.parse(g('rb_rewards')||'null');if(r&&typeof r==='object'){['wag','rb'].forEach(function(k){if(typeof r[k]==='number')r[k]=Math.round(r[k]*f*100)/100});s('rb_rewards',JSON.stringify(r))}}catch(e){}
 s('rb_cur',nc);code=nc;return f;
}
window.RBCUR={codes:CODES,code:function(){return code},sym:function(c){return SYM[c||code]},rate:function(c){return rates[c||code]},fmt:fmt,bal:bal,set:set};
refresh();
})();
</script>
<script id="rbStats">(function(){
if(window.RBSTATS||!window.RBCUR)return;
var R=RBCUR;
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function j(k,d){try{var x=JSON.parse(g(k)||'null');return x==null?d:x}catch(e){return d}}
function rn(n){return Math.round(n*1e4)/1e4}
function bal(){var b=parseFloat(g('bj_bal'));return isFinite(b)?b:1000}
function stats(){return Object.assign({bets:0,wins:0,losses:0,wagered:0,won:0,lost:0},j('rb_stats',{}))}
function log(){var l=j('rb_betlog',[]);return Array.isArray(l)?l:[]}
function snap(){s('rb_snap',JSON.stringify({b:bal(),c:R.code()}))}
/* record(wager,payout,game): montos en la moneda activa. Lo guarda todo en USD para que cambiar de moneda no rompa nada. */
function record(wager,payout,game,auto){
 wager=+wager||0;payout=+payout||0;if(wager<=0&&payout<=0)return;
 var k=R.rate(),w=wager/k,p=payout/k,t=stats(),net=p-w;
 t.bets++;t.wagered=rn(t.wagered+w);
 if(net>0.00001){t.wins++;t.won=rn(t.won+net)}else if(net<-0.00001){t.losses++;t.lost=rn(t.lost-net)}
 s('rb_stats',JSON.stringify(t));
 var id=(parseInt(g('rb_betid'),10)||1000000)+1;s('rb_betid',String(id));
 var l=log();l.unshift({id:id,t:Date.now(),g:game||'Casino',w:rn(w),p:rn(p),a:auto?1:0});
 s('rb_betlog',JSON.stringify(l.slice(0,200)));
 if(!auto)snap();
}
/* Si el saldo cambio desde la ultima vez (por ejemplo al volver de un juego) y nadie lo registro, se cuenta como apuesta ganada/perdida */
function sync(){
 var sn=j('rb_snap',null),b=bal(),c=R.code();
 if(!sn||sn.c!==c){snap();return}
 var d=Math.round((b-sn.b)*100)/100;
 if(Math.abs(d)<0.01)return;
 record(Math.abs(d),d>0?2*d:0,'Casino',true);snap();
}

function tx(ty,amt,label){var a=(+amt||0)/R.rate();if(!(a>0))return;
 var id=(parseInt(g('rb_txid'),10)||5000000)+1;s('rb_txid',String(id));
 var l=j('rb_txlog',[]);if(!Array.isArray(l))l=[];l.unshift({id:id,t:Date.now(),ty:ty,a:rn(a),l:label||''});s('rb_txlog',JSON.stringify(l.slice(0,300)));
 var f=j('rb_life',{});f[ty]=rn((+f[ty]||0)+a);s('rb_life',JSON.stringify(f))}
function txlog(){var l=j('rb_txlog',[]);return Array.isArray(l)?l:[]}
function life(){return j('rb_life',{})}

window.RBSTATS={tx:tx,txlog:txlog,life:life,get:stats,log:log,record:record,sync:sync,snap:snap,
 fmt:function(usd){return R.fmt(usd*R.rate())},money:function(usd){return usd*R.rate()}};
sync();
if(!window.RBGAME){addEventListener('pageshow',sync);addEventListener('focus',sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()})}
})();</script>
