<script>
(function(){
  var tabs=document.querySelectorAll('.tab'),go=document.getElementById('go'),amt=document.getElementById('amt');
  function upd(){var v=parseFloat(amt.value);go.classList.toggle('ready',v>0)}
  tabs.forEach(function(t){t.addEventListener('click',function(){
    tabs.forEach(function(x){x.classList.remove('on')});t.classList.add('on');go.textContent=t.dataset.t;
  })});
  amt.addEventListener('input',function(){amt.value=amt.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');upd()});
  document.getElementById('max').addEventListener('click',function(){amt.value='0.00';upd()});
  document.getElementById('x').addEventListener('click',function(){if(history.length>1)history.back()});
})();
</script>
